[package]
name = "spiderbot_visual_clean_v3"
version = "0.5.0"
edition = "2024"

[dependencies]
bevy = "0.19.0"
bevy_rapier3d = { version = "0.35.0", features = ["debug-render-3d"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
debug = 0
opt-level = 2
